{% extends "base.html" %}

{% block title %}
  <title>Tags</title>
{% endblock %}

{% block content %}
  <h1 class="d-flex justify-content-between align-items-center">
    Tags
    <a class="btn btn-primary" href="{% url 'todo:tag-create' %}">Add</a>
  </h1>

  {% if tag_list %}
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>{{ tag.name }}</td>
            <td>
              <a class="btn btn-secondary" href="{% url 'todo:tag-update' pk=tag.pk %}">Update</a>
            </td>
            <td>
              <a class="btn btn-secondary" href="{% url 'todo:tag-delete' pk=tag.pk %}">Delete</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

  {% else %}
    <p>No tags yet.</p>
  {% endif %}
{% endblock %}
